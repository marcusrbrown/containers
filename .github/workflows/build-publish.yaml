name: Build and Publish Multi-Architecture Containers

on:
  push:
    paths:
      - '**/Dockerfile'
      # Every active image context. A new context under a new top-level
      # directory must be added here; tests/test_detect_changed_containers.py
      # fails until it is.
      - 'node/**'
      - 'scripts/**'
      - '!archived/**'
      - '!templates/**'
      - '!.devcontainer/**'
    branches:
      - main
  pull_request:
    paths:
      - '**/Dockerfile'
      # Every active image context. A new context under a new top-level
      # directory must be added here; tests/test_detect_changed_containers.py
      # fails until it is.
      - 'node/**'
      - 'scripts/**'
      - '!archived/**'
      - '!templates/**'
      - '!.devcontainer/**'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build for'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      push_images:
        description: 'Push images to registry'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Push runs on main must queue: each push diffs only before..sha, so cancelling
  # an earlier run would drop its image changes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  DOCKERHUB_USERNAME: marcusrbrown

jobs:
  detect-changes:
    name: Detect Changed Containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect changed containers
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          # PR: base...head. Push: before..sha (all zeros on a new branch).
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A context is changed when ANY file under its directory changed.
          # Fails the job on git errors; workflow_dispatch selects everything.
          python3 scripts/detect_changed_containers.py \
            --format build-matrix \
            --event "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  build-multiarch:
    name: Build Multi-Arch Container
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            network=host
          buildkitd-flags: --debug

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ matrix.image }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix={{branch}}-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{branch}},enable={{is_default_branch}}

      - name: Validate generated tags
        run: |
          echo "Generated tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Generated labels:"
          echo "${{ steps.meta.outputs.labels }}"

          # Validate tag format (basic check for invalid characters)
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            if [[ "$tag" =~ :-|:$|\*\*\* ]]; then
              echo "ERROR: Invalid tag format detected: $tag"
              exit 1
            fi
          done

      - name: Build and push multi-arch container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ (github.event_name != 'pull_request') && (inputs.push_images != false) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          provenance: false

      - name: Generate build summary
        if: always()
        run: |
          echo "## Multi-Architecture Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Container | ${{ matrix.image }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Context | ${{ matrix.context }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Platforms | ${{ inputs.platforms || 'linux/amd64,linux/arm64' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Push | ${{ (github.event_name != 'pull_request') && (inputs.push_images != false) }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags Generated" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
