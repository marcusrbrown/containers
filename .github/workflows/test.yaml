name: Automated Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: 'pyproject.toml'
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  prepare:
    if: github.event_name != 'workflow_dispatch'
    name: Prepare
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            changes:
              - '**/*.py'
              - '**/Dockerfile'
              - '**/*.yaml'
              - '**/*.yml'
              - 'pyproject.toml'
              # Image contexts (lockfiles, package.json, source, entrypoints).
              - 'node/**'
              - 'scripts/**'
              - '!archived/**'
              - '!templates/**'

  # Deliberately not gated on `prepare`: that filter only decides whether the
  # Python jobs run. Which images to build is decided by the shared detector
  # from the actual diff, so a lockfile-only change cannot be filtered out.
  detect-containers:
    name: Detect Changed Containers
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.detect.outputs.containers }}
      has-containers: ${{ steps.detect.outputs.has-containers }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect containers to test
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          # PR: base...head. Push: before..sha (all zeros on a new branch).
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A context is changed when ANY file under its directory changed.
          # Fails the job on git errors; workflow_dispatch selects everything.
          python3 scripts/detect_changed_containers.py \
            --format test-containers \
            --event "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  container-builds:
    name: Test Container Build
    runs-on: ubuntu-latest
    needs: detect-containers
    if: needs.detect-containers.outputs.has-containers == 'true'
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJSON(needs.detect-containers.outputs.containers) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.container.path }}
          file: ${{ matrix.container.path }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: test/${{ matrix.container.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container functionality
        run: |
          # Basic container inspection
          docker image inspect test/${{ matrix.container.name }}:latest

          # Test container can start (if it has an entrypoint/cmd)
          if docker run --rm --entrypoint="" test/${{ matrix.container.name }}:latest sh -c "exit 0" 2>/dev/null; then
            echo "✓ Container starts successfully"
          else
            echo "ℹ Container requires specific entrypoint (this is normal for some containers)"
          fi

  python-tests:
    name: Python Script Testing
    needs: prepare
    if: github.event_name == 'workflow_dispatch' || needs.prepare.outputs.changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Install dev dependencies
        run: poetry install --with dev

      - name: Run Python script tests
        run: |
          # Run the pytest suite
          poetry run pytest tests/ -v

          # Test script imports and basic functionality
          poetry run python -c "
          import sys
          sys.path.append('scripts')

          # Test core scripts can be imported
          modules = [
              'generate_dockerfile',
              'collect_docker_metrics',
              'generate_image_tags',
              'build_multiarch',
              'template_engine'
          ]

          for module in modules:
              try:
                  __import__(module)
                  print(f'✓ {module} imports successfully')
              except Exception as e:
                  print(f'✗ {module} failed to import: {e}')
                  sys.exit(1)
          "

      - name: Test Poetry script entry points
        run: |
          # Test that all Poetry scripts are callable
          poetry run generate-dockerfile --help
          poetry run collect-docker-metrics --help
          poetry run generate-image-tags --help

      - name: Validate script configurations
        run: |
          # Validate pyproject.toml
          poetry check

  linting:
    name: Code Quality & Linting
    needs: prepare
    if: github.event_name == 'workflow_dispatch' || needs.prepare.outputs.changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Setup Node.js for Dockerfile linting
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Run Hadolint (Dockerfile linting)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: './node/*/Dockerfile'
          recursive: true
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Upload Hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: hadolint.sarif

      - name: Install dev dependencies
        run: poetry install --with dev

      - name: Run Python linting with Black
        run: poetry run black --check --diff scripts/*.py

      - name: Run Python static analysis
        run: |
          # Run pylint on scripts directory with some common warnings disabled for now
          poetry run pylint scripts/ --disable=C0114,C0115,C0116,R0903,W0613 --reports=n || true

      - name: Check Python import sorting
        run: poetry run isort --check-only --diff scripts/*.py

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: detect-containers
    if: needs.detect-containers.outputs.has-containers == 'true'
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJSON(needs.detect-containers.outputs.containers) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build image for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.container.path }}
          file: ${{ matrix.container.path }}/Dockerfile
          platforms: linux/amd64
          push: false
          tags: scan/${{ matrix.container.name }}:latest
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.container.name }}:latest
          format: sarif
          output: trivy-${{ matrix.container.name }}.sarif
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.container.name }}.sarif

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.container.path }}
          format: sarif
          output: trivy-config-${{ matrix.container.name }}.sarif
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: config
          sarif_file: trivy-config-${{ matrix.container.name }}.sarif

  container-builds-result:
    name: Test Container Builds
    if: always()
    needs: [detect-containers, container-builds]
    runs-on: ubuntu-latest
    steps:
      - name: Check container build results
        run: |
          result="${{ needs.container-builds.result }}"
          if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
            echo "Container builds: $result"
            exit 1
          fi
          echo "Container builds: $result"

  security-scan-result:
    name: Security Scanning
    if: always()
    needs: [detect-containers, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Check security scan results
        run: |
          result="${{ needs.security-scan.result }}"
          if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
            echo "Security scanning: $result"
            exit 1
          fi
          echo "Security scanning: $result"
